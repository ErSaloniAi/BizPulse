{% if messages %}
    <div class="messages-container mb-3">
        {% for message in messages %}
            <div class="alert {{ message.tags }} alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
                {% if 'success' in message.tags %}
                    <i class="bi bi-check-circle-fill me-2 fs-5 text-success"></i>
                {% elif 'warning' in message.tags %}
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 text-warning"></i>
                {% elif 'danger' in message.tags or 'error' in message.tags %}
                    <i class="bi bi-x-circle-fill me-2 fs-5 text-danger"></i>
                {% else %}
                    <i class="bi bi-info-circle-fill me-2 fs-5 text-info"></i>
                {% endif %}
                <div class="flex-grow-1">{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
